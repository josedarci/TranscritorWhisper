name: Transcritor Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, feature/basededados ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Run Automated Test Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: transcritor
        ports:
          - 3306:3306

    steps:
      - name: Checkout Código
        uses: actions/checkout@v3

      - name: Configurar Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas mysql-connector-python

      - name: Instalar Dependências Node.js Backend
        run: |
          cd transcritor-whisper/backend
          npm install

      - name: Executar Testes Automatizados (Agente 11)
        run: |
          python -m unittest discover -s tests -p "test_*.py"
