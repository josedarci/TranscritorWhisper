<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-gradient)" rx="16" />
  <rect x="2" y="2" width="1196" height="416" fill="none" stroke="#1f293d" stroke-width="2" rx="14" />

  <!-- Abstract Tech Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Glowing Audio Waveforms -->
  <g filter="url(#glow)" opacity="0.85">
    <path d="M 100 210 Q 150 150 200 210 T 300 210 T 400 210 T 500 210 T 600 210 T 700 210 T 800 210 T 900 210 T 1000 210 T 1100 210" fill="none" stroke="url(#cyan-glow)" stroke-width="3" />
    <path d="M 100 210 Q 180 270 260 210 T 420 210 T 580 210 T 740 210 T 900 210 T 1060 210" fill="none" stroke="url(#accent-gradient)" stroke-width="2.5" opacity="0.7" />
  </g>

  <!-- Central Icon Badge -->
  <circle cx="600" cy="115" r="42" fill="#1e293b" stroke="url(#cyan-glow)" stroke-width="3" filter="url(#glow)" />
  <text x="600" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" text-anchor="middle">🎙️</text>

  <!-- Title Text -->
  <text x="600" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    TRANSCRITOR INTELIGENTE ENTERPRISE
  </text>

  <!-- Gradient Subtitle Line -->
  <rect x="350" y="225" width="500" height="4" rx="2" fill="url(#accent-gradient)" />

  <!-- Tech Stack Pills -->
  <text x="600" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#38bdf8" text-anchor="middle" letter-spacing="1.2">
    Whisper • Ollama (Llama 3) • RAG • Node.js • MySQL • Docker
  </text>

  <!-- Slogan -->
  <text x="600" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="15" fill="#94a3b8" text-anchor="middle">
    Transcrição de Alta Precisão, Busca Semântica Híbrida e IA Local para Reuniões Corporativas
  </text>

  <!-- Feature Badges Row -->
  <g transform="translate(210, 345)">
    <rect x="0" y="0" width="135" height="28" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="67.5" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">⚡ Parallel Workers</text>

    <rect x="150" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="222.5" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">🗣️ Speaker Diarization</text>

    <rect x="310" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="380" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">🔐 JWT &amp; Multitenant</text>

    <rect x="465" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="535" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">📌 RAG Citation %</text>

    <rect x="620" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="690" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">📝 Atas PDF</text>
  </g>
</svg>